<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Kopi - Cafe & Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
 <button type="button" class="btn btn-warning btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#promoModal">
        Promo Hari Ini
 </button>
    <section id="reservasi" class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow border-0 p-4">
                        <h3 class="text-center fw-bold mb-3">Reservasi Meja</h3>
                        <form>
                            <div class="mb-3">
                                <label for="nama" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama" placeholder="Masukkan nama Anda"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Alamat Email</label>
                                <input type="email" class="form-control" id="email" placeholder="nama@email.com"
                                    required>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label for="tanggal" class="form-label">Tanggal</label>
                                    <input type="date" class="form-control" id="tanggal" required>
                                </div>
                                <div class="col-6">
                                    <label for="jumlah" class="form-label">Jumlah Orang</label>
                                    <input type="number" class="form-control" id="jumlah" min="1" placeholder="1"
                                        required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="catatan" class="form-label">Catatan Khusus</label>
                                <textarea class="form-control" id="catatan" rows="3" placeholder="Contoh: Meja dekat
                                jendela"></textarea>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 fw-bold">Kirim Reservasi</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
