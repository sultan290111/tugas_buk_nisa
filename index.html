<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Kopi - Cafe & Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
 <button type="button" class="btn btn-warning btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#promoModal">
        Promo Hari Ini
 </button>
    <section id="reservasi" class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow border-0 p-4">
                        <h3 class="text-center fw-bold mb-3">Reservasi Meja</h3>
                        <form>
                            <div class="mb-3">
                                <label for="nama" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama" placeholder="Masukkan nama Anda"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Alamat Email</label>
                                <input type="email" class="form-control" id="email" placeholder="nama@email.com"
                                    required>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label for="tanggal" class="form-label">Tanggal</label>
                                    <input type="date" class="form-control" id="tanggal" required>
                                </div>
                                <div class="col-6">
                                    <label for="jumlah" class="form-label">Jumlah Orang</label>
                                    <input type="number" class="form-control" id="jumlah" min="1" placeholder="1"
                                        required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="catatan" class="form-label">Catatan Khusus</label>
                                <textarea class="form-control" id="catatan" rows="3" placeholder="Contoh: Meja dekat jendela"></textarea>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 fw-bold">Kirim Reservasi</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div class="modal fade" id="promoModal" tabindex="-1" aria-labelledby="promoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title fw-bold" id="promoModalLabel">🎉 Promo Spesial Hari Ini!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <h4 class="fw-bold">Diskon 20% All Item</h4>
                    <p class="text-muted">Gunakan kode kupon di bawah ini saat bertransaksi di kasir:</p>
                    <div class="badge bg-dark fs-5 p-2 mb-3">AROMAF34</div>
                    <p class="small text-danger">*Berlaku hanya untuk pembelian hari ini.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
